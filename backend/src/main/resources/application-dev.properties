# SOMENTE DESENVOLVIMENTO LOCAL. Estes valores são PÚBLICOS (o repositório é aberto).
# A StartupGuard impede que o JWT secret e a chave de criptografia abaixo sejam usados fora do perfil dev.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studiy}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

studiy.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
studiy.crypto.key=${STUDIY_ENCRYPTION_KEY:7a0KtYJAFva4wUDkbHJ9lAPMQZBhbqDvKI2S/YVKUcg=}

studiy.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
studiy.front.url=${FRONT_URL:http://localhost:5500}

# Facilidades de dev (proibidas fora deste perfil)
studiy.auth.expor-token-reset-dev=true
studiy.pagamento.simulacao=true
# Dev roda em http://localhost: cookies sem Secure (proibido fora de dev)
studiy.auth.cookie-secure=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
