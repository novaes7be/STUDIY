spring.application.name=studiy-backend
# FAIL-CLOSED: este arquivo NÃO tem nenhum segredo nem valor sensível padrão.
# Sem perfil (ou com prod), a aplicação só sobe com todas as variáveis definidas.
# Para desenvolvimento local: SPRING_PROFILES_ACTIVE=dev (veja application-dev.properties).
# A StartupGuard aborta a subida se valores de dev/simulação aparecerem fora do perfil dev.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
# Nunca devolver mensagens internas/stack traces ao cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---- Segredos: SEMPRE por variável de ambiente ----
studiy.jwt.secret=${JWT_SECRET}
# Acesso curto (cookie studiy_at) + refresh rotativo (cookie studiy_rt)
studiy.jwt.expiration-ms=900000
studiy.jwt.refresh-dias=14
# Cookies de sessão com Secure (só HTTPS). Desligar é permitido SOMENTE no perfil dev.
studiy.auth.cookie-secure=true
studiy.crypto.key=${STUDIY_ENCRYPTION_KEY}
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ---- CORS: origens EXATAS do front, separadas por vírgula ----
studiy.cors.origins=${CORS_ORIGINS}

# ---- Conta / LGPD ----
studiy.auth.expor-token-reset-dev=false
studiy.termos.versao=2026-10

# ---- Limites por plano (PDFs/IA por mês) ----
studiy.limits.free.pdfs-por-mes=20
studiy.limits.premium.pdfs-por-mes=300

# ---- Rate limit (requisições por minuto) ----
studiy.ratelimit.auth-por-minuto=10
studiy.ratelimit.ia-por-minuto=5
studiy.ratelimit.upload-por-minuto=10
# Vazio = buckets em memória (uma instância). Várias instâncias: redis://host:6379 (ou rediss:// com TLS)
studiy.ratelimit.redis-url=${STUDIY_REDIS_URL:}

# IP do cliente: por padrão NÃO confia em X-Forwarded-For (qualquer um forjaria o IP e furaria o rate limit).
# O perfil prod liga isso só para o proxy (Caddy) na rede interna do Docker.
server.forward-headers-strategy=none

# ---- Anthropic (IA) ----
anthropic.api.model=claude-haiku-5-5
anthropic.api.effort=low
anthropic.api.url=https://api.anthropic.com/v1/messages
# Preço por milhão de tokens (US$) para o log de custo. Claude Haiku 5.5 (prompts até 100K tokens):
# entrada 0,10 / saída 0,50. Cache: escrita 1,25x e leitura 0,1x da entrada. Confira a tabela atual
# em https://www.anthropic.com/pricing ao trocar de modelo.
studiy.ia.preco.entrada-usd-mtok=0.10
studiy.ia.preco.saida-usd-mtok=0.50
studiy.ia.preco.cache-escrita-usd-mtok=0.125
studiy.ia.preco.cache-leitura-usd-mtok=0.01

# ---- Retenção (job diário de limpeza) ----
studiy.retencao.cron=0 30 3 * * *
studiy.retencao.ia-dias=180

# ---- Upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Pagamentos (Plano Pro: cartão ou Pix via Mercado Pago) ----
studiy.pagamento.preco-centavos=2000
studiy.pagamento.dias-pro=30
# Simulação só pode ser ligada no perfil dev (a StartupGuard bloqueia fora dele).
studiy.pagamento.simulacao=false
studiy.pagamento.mp.access-token=${MP_ACCESS_TOKEN:}
studiy.pagamento.mp.webhook-secret=${MP_WEBHOOK_SECRET:}
studiy.pagamento.api-publica=${API_PUBLIC_URL:}

# ---- E-mail ----
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
studiy.mail.from=${MAIL_FROM:}
studiy.front.url=${FRONT_URL}

# ---- Swagger: desligado por padrão (o perfil dev liga) ----
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
