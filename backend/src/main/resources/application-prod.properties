# PRODUÇÃO: herda o application.properties (sem valores padrão para segredos).
# Se alguma variável faltar, a aplicação não inicia (de propósito).
studiy.pagamento.simulacao=false
studiy.auth.expor-token-reset-dev=false
studiy.pagamento.mp.access-token=${MP_ACCESS_TOKEN}
studiy.pagamento.mp.webhook-secret=${MP_WEBHOOK_SECRET}
studiy.pagamento.api-publica=${API_PUBLIC_URL}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Atrás do Caddy: aceita X-Forwarded-For SÓ de proxies da rede interna (a API não fica exposta, veja
# docker-compose.yml). Ajuste TRUSTED_PROXIES (regex de IPs) se o proxy estiver em outra rede.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}}
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
