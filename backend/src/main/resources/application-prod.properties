# PRODUÇÃO: herda o application.properties (sem valores padrão para segredos).
# Se alguma variável faltar, a aplicação não inicia (de propósito).
studiy.pagamento.simulacao=false
studiy.auth.expor-token-reset-dev=false
studiy.pagamento.mp.access-token=${MP_ACCESS_TOKEN}
studiy.pagamento.mp.webhook-secret=${MP_WEBHOOK_SECRET}
studiy.pagamento.api-publica=${API_PUBLIC_URL}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Atrás do Caddy/proxy: usa o IP real do cliente (X-Forwarded-For de proxies internos) no rate limit
server.forward-headers-strategy=native
