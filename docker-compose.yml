# Sobe Postgres + API + site com HTTPS (Caddy). Copie .env.example para .env e preencha antes.
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: studiy
      POSTGRES_USER: ${DB_USER:?defina DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d studiy"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/studiy
      EXTRATOR_URL: http://extrator:8000
    depends_on:
      db:
        condition: service_healthy
      extrator:
        condition: service_started
    expose:
      - "8080"      # só o Caddy acessa; não fica aberta para a internet
    restart: unless-stopped

  # PDF -> Markdown com figuras (PyMuPDF). Só a API alcança (rede interna); sem porta publicada.
  extrator:
    build: ./pdf-extrator
    environment:
      EXTRATOR_TOKEN: ${EXTRATOR_TOKEN:?defina EXTRATOR_TOKEN}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        API_ORIGIN: ${API_ORIGIN:-}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      API_ORIGIN: ${API_ORIGIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
