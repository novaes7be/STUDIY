<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Entrar — Studiy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body data-page="login">
<div class="auth-top"><button class="icon-btn" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro"><svg class="i-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="i-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
<main class="auth">
  <div class="auth-card">
    <a class="logo" href="index.html">Studiy</a>
    <h1>Entrar</h1>
    <p class="sub">Continue de onde parou.</p>
    <div id="msg" class="msg" role="alert" aria-live="assertive" hidden></div>
    <form id="authForm" novalidate>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-grad btn-block i-user" type="submit">Entrar</button>
    </form>
    <div class="auth-links"><a href="recuperar-senha.html">Esqueci a senha</a><a href="cadastro.html">Criar conta</a></div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
