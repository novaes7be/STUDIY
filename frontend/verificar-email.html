<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP gerada por deploy/build-front.sh (connect-src por ambiente) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Confirmar e-mail — Studiy</title>
<link rel="preload" href="fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<script src="js/theme.js"></script>
<script src="js/motion.js" defer></script>
<script src="js/botao.js" defer></script>
</head>
<body data-page="verificar">
<div class="auth-top"><button class="icon-btn" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro"><svg class="i-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="i-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
<main class="auth">
  <section class="auth-hero">
    <a class="logo" href="index.html">STUDIY<span class="logo-dot">.</span></a>
    <h1 class="display auth-title" data-scramble>Confirmar e-mail.</h1>
    <p class="auth-sub">Não recebeu o link? Informe seu e-mail e enviamos outro.</p>
    <p class="auth-tag" aria-hidden="true">Estude menos. Aprenda mais.</p>
  </section>
  <div class="auth-card">
    <a class="back-home" href="index.html">Voltar para a home</a>
    <div id="msg" class="msg" role="alert" aria-live="assertive" hidden></div>
    <form id="etapaEmail" novalidate>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div>
      <button class="btn btn-accent btn-lg btn-block btn-arrow" type="submit">Reenviar link</button>
    </form>
    <div class="auth-links"><a href="login.html">Voltar ao login</a><span></span></div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
