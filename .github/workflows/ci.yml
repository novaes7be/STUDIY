name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unitários + integração com Postgres/Redis via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # verify = surefire (unitários) + failsafe (*IT: Postgres real, Flyway, MockMvc pela cadeia de segurança)
      - run: mvn -B verify
        working-directory: backend
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-teste
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  extrator:
    name: Extrator de PDF (Python, PyMuPDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pdf-extrator/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: pdf-extrator
      - run: python -m pytest -q
        working-directory: pdf-extrator

  frontend:
    name: Front (build de produção + regras de segurança)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build de produção (falha se a CSP/config apontar para http, localhost ou fontes externas)
        run: deploy/build-front.sh prod
      - name: Nada de innerHTML/outerHTML/insertAdjacentHTML/document.write com dados
        run: |
          if grep -rnE "\.(innerHTML|outerHTML)\s*=|insertAdjacentHTML|document\.write" frontend/js; then
            echo "::error::Use textContent/createElement; HTML a partir de dados é proibido (XSS)."; exit 1
          fi
      - name: Sintaxe dos scripts
        run: for f in frontend/js/*.js; do node --check "$f"; done

  gitleaks:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  imagens:
    name: Imagens Docker (backend, extrator e site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Garante que atualizações de imagem base (Dependabot) realmente compilam antes do merge
      - name: Imagem do backend
        run: docker build -t studiy-api:ci backend
      - name: Imagem do extrator
        run: docker build -t studiy-extrator:ci pdf-extrator
      - name: Imagem do site
        run: docker build -f deploy/Dockerfile -t studiy-web:ci .
