version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: pip
    directory: /pdf-extrator
    schedule:
      interval: weekly
    groups:
      pymupdf:
        # pymupdf4llm exige a MESMA versão do pymupdf: atualizar juntos
        patterns: ["pymupdf*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/backend", "/deploy", "/pdf-extrator"]
    schedule:
      interval: weekly
    ignore:
      # O backend é Java 17 (LTS) e o Lombok quebra o build no JDK 25/26.
      # Trocar de versão de Java é uma migração própria, não uma atualização automática.
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"
