# PRODUÇÃO: sem valores padrão. Se alguma variável faltar, a aplicação não inicia (de propósito).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
studiy.jwt.secret=${JWT_SECRET}
studiy.crypto.key=${STUDIY_ENCRYPTION_KEY}
studiy.cors.origins=${CORS_ORIGINS}
studiy.auth.expor-token-reset-dev=false

# Pagamentos reais: credenciais obrigatórias e simulação desligada
studiy.pagamento.simulacao=false
studiy.pagamento.mp.access-token=${MP_ACCESS_TOKEN}
studiy.pagamento.mp.webhook-secret=${MP_WEBHOOK_SECRET}
studiy.pagamento.api-publica=${API_PUBLIC_URL}

# E-mail e front (link de recuperação de senha)
studiy.front.url=${FRONT_URL}
studiy.mail.from=${MAIL_FROM:}

# Swagger desligado em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
