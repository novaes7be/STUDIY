spring.application.name=studiy-backend
# Os valores padrão abaixo servem SÓ para desenvolvimento local (são públicos).
# Em produção use SPRING_PROFILES_ACTIVE=prod: o perfil prod exige todas as variáveis e não sobe sem elas.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studiy}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
# Nunca devolver mensagens internas/stack traces ao cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---- Segredos (em produção: SEMPRE por variável de ambiente) ----
studiy.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
studiy.jwt.expiration-ms=7200000
studiy.crypto.key=${STUDIY_ENCRYPTION_KEY:7a0KtYJAFva4wUDkbHJ9lAPMQZBhbqDvKI2S/YVKUcg=}
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ---- CORS: somente os domínios do front ----
studiy.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ---- Conta / LGPD ----
studiy.auth.expor-token-reset-dev=true
studiy.termos.versao=2026-10

# ---- Limites por plano (PDFs/IA por mês) ----
studiy.limits.free.pdfs-por-mes=20
studiy.limits.premium.pdfs-por-mes=300

# ---- Rate limit (requisições por minuto) ----
studiy.ratelimit.auth-por-minuto=10
studiy.ratelimit.ia-por-minuto=5
studiy.ratelimit.upload-por-minuto=10

# ---- Anthropic (IA) ----
# Haiku 5.5: ~87% mais barato que o 4.5. Para voltar ao 4.5: model=claude-haiku-4-5-20251001 e effort vazio.
anthropic.api.model=claude-haiku-5-5
anthropic.api.effort=low
anthropic.api.url=https://api.anthropic.com/v1/messages

# ---- Upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Pagamentos (Plano Pro: cartão ou Pix via Mercado Pago) ----
studiy.pagamento.preco-centavos=2000
studiy.pagamento.dias-pro=30
# Sem MP_ACCESS_TOKEN e com simulacao=true, o checkout vira um teste local (sem cobrança). Em produção fica false.
studiy.pagamento.simulacao=true
studiy.pagamento.mp.access-token=${MP_ACCESS_TOKEN:}
studiy.pagamento.mp.webhook-secret=${MP_WEBHOOK_SECRET:}
# URL pública HTTPS da API (para o Mercado Pago chamar o webhook). Em dev local use um túnel (ngrok).
studiy.pagamento.api-publica=${API_PUBLIC_URL:}
